<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100대 사찰 순례 가이드</title>
<meta name="description" content="대한민국을 대표하는 사찰 100곳을 지도에서 찾고, 역사·코스·사진·내 순례 기록까지 한곳에서.">
<!-- 링크 미리보기(카카오톡·페이스북 등). 배포 주소가 정해지면 아래 URL을 본인 주소로 고칠 것 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="100대 사찰 순례 가이드">
<meta property="og:title" content="100대 사찰 순례 가이드">
<meta property="og:description" content="대한민국을 대표하는 사찰 100곳을 지도에서 찾고, 역사·코스·사진·내 순례 기록까지 한곳에서.">
<!-- <meta property="og:url" content="https://계정명.github.io/저장소명/"> -->
<!-- <meta property="og:image" content="https://계정명.github.io/저장소명/og-image.png"> -->
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f4f2ed;
    --panel: #ffffff;
    --ink: #232623;
    --muted: #6e7470;
    --line: #e2dfd7;
    --accent: #8a3b2e;       /* 단청 적갈 */
    --accent-soft: #f5e8e3;
    --accent-deep: #4a1f1a;
    --done: #2b4c7e;
    /* 마커: 창건 시기별 (오래될수록 짙게) */
    --h1: #f4a259; /* 6세기 이전 */
    --h2: #e76f2c; /* 7세기 */
    --h3: #c0392b; /* 8~10세기 */
    --h4: #7b1f2b; /* 11세기 이후 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Pretendard", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    display: grid; grid-template-rows: auto 1fr;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  .progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .progress-bar { width: 140px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progress-bar i { display: block; height: 100%; width: 0; background: var(--done); transition: width .3s; }
  .progress b { color: var(--ink); }

  main { display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
  aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
  .controls { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .search {
    width: 100%; padding: 10px 12px; font: inherit; font-size: 14px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 10px; font: inherit; font-size: 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .row select { font: inherit; font-size: 12px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }

  ul.list { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; }
  ul.list li { margin: 0; }
  .item {
    width: 100%; display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px;
    padding: 10px 16px; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .item:hover { background: var(--bg); }
  .item.active { background: var(--accent-soft); }
  .item .no { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .nm { font-size: 15px; font-weight: 600; }
  .item .lc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item .ht { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .item .ht small { display: block; font-weight: 400; color: var(--done); font-size: 11px; }
  .empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px; }

  .map-wrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; background: #e3e6df; }
  .legend {
    position: absolute; left: 12px; bottom: 24px; z-index: 500;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 11px; color: var(--muted); display: grid; gap: 4px;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  .detail {
    position: absolute; top: 12px; right: 12px; z-index: 600; width: 360px; max-height: calc(100% - 24px);
    overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(40, 20, 15, .15); display: none;
  }
  .detail.open { display: block; }
  .d-head { padding: 18px 18px 14px; background: linear-gradient(160deg, var(--accent), var(--accent-deep)); color: #fff; position: relative; }
  .d-head .close {
    /* z-index: 반투명 텍스트가 버튼 위에 그려져 클릭을 가로채지 않도록 */
    position: absolute; top: 10px; right: 10px; z-index: 2; width: 36px; height: 36px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 22px; cursor: pointer; line-height: 1;
  }
  .d-head .close:hover { background: rgba(255,255,255,.32); }
  .leaflet-interactive.tp-marker { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .45)); }
  .d-head .tag { font-size: 11px; opacity: .8; padding-right: 40px; }
  .d-head h2 { margin: 4px 0 2px; font-size: 24px; letter-spacing: -0.02em; }
  .d-head .loc { font-size: 13px; opacity: .85; }
  .d-head .big { font-size: 30px; font-weight: 700; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .d-head .big small { font-size: 14px; font-weight: 400; opacity: .8; }
  .d-body { padding: 16px 18px 18px; display: grid; gap: 14px; }
  .d-body > * { min-width: 0; }
  .d-body p { margin: 0; font-size: 14px; line-height: 1.65; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; color: var(--accent); border: 1px solid var(--accent); padding: 0 8px; border-radius: 999px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .dots { letter-spacing: 2px; color: var(--done); }
  .section-t { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .course { font-size: 13px; line-height: 1.7; background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 120px; padding: 10px; font: inherit; font-size: 13px; font-weight: 600; text-align: center;
    border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; text-decoration: none;
  }
  .btn.primary { background: var(--panel); border-color: var(--done); color: var(--done); }
  .btn.primary.is-done { background: var(--done); border-color: var(--done); color: #fff; }
  .note { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .gallery { margin: -16px -18px 0; }
  .g-main { position: relative; aspect-ratio: 16 / 10; background: var(--bg); cursor: zoom-in; overflow: hidden; }
  .g-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .g-count { position: absolute; right: 8px; bottom: 8px; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 999px; }
  .g-thumbs { display: flex; gap: 6px; padding: 8px 18px 0; overflow-x: auto; }
  .g-thumbs button { flex: 0 0 64px; height: 44px; padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; background: var(--bg); }
  .g-thumbs button[aria-current="true"] { border-color: var(--accent); }
  .g-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .credit { font-size: 10.5px; color: var(--muted); padding: 6px 18px 0; line-height: 1.4; overflow-wrap: anywhere; }
  .credit a { color: inherit; }
  .log { display: grid; gap: 8px; }
  .log .section-t { margin-bottom: 0; }
  .log textarea {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; resize: vertical; width: 100%; line-height: 1.5;
  }
  .link-btn { font: inherit; font-size: inherit; color: var(--done); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .no-photo { padding: 18px; text-align: center; font-size: 12px; color: var(--muted); background: var(--bg); line-height: 1.6; }

  .lightbox { position: fixed; inset: 0; z-index: 2000; background: rgba(16, 12, 10, .92); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 110px); object-fit: contain; border-radius: 6px; }
  .lightbox .cap { color: #ddd5d0; font-size: 12px; margin-top: 10px; text-align: center; max-width: 900px; overflow-wrap: anywhere; }
  .lightbox .cap a { color: inherit; }
  .lb-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 22px; cursor: pointer; }
  .lb-btn:hover { background: rgba(255,255,255,.25); }
  .lb-prev { left: 16px; } .lb-next { right: 16px; }
  .lb-close { top: 16px; right: 16px; transform: none; }

  .leaflet-tooltip.tp-label { font-family: inherit; font-size: 12px; font-weight: 600; padding: 2px 6px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 3000; background: #2b2b2b; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 8px; display: none; max-width: calc(100vw - 32px); }
  .toast.show { display: block; }

  @media (max-width: 820px) {
    body { height: auto; min-height: 100%; }
    header { flex-wrap: wrap; padding: 12px 16px; }
    .progress { margin-left: 0; width: 100%; }
    .progress-bar { flex: 1; }
    main { grid-template-columns: 1fr; grid-template-rows: 48vh auto; }
    .map-wrap { order: 1; height: 48vh; }
    aside { order: 2; border-right: 0; }
    ul.list { overflow: visible; }
    .detail { position: fixed; top: auto; right: 0; left: 0; bottom: 0; width: auto; max-height: 75vh; border-radius: 16px 16px 0 0; z-index: 1000; }
    .legend { bottom: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .progress-bar i { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>☸ 100대 사찰 <span>순례 가이드</span></h1>
  <div class="progress" title="Supabase에 저장되어 모든 방문자가 같은 기록을 봅니다">
    <span>순례 완료 <b id="doneCount">0</b> / 100</span>
    <div class="progress-bar"><i id="doneBar"></i></div>
  </div>
</header>

<main>
  <aside>
    <div class="controls">
      <input id="q" class="search" type="search" placeholder="사찰 이름 또는 지역 검색 (예: 해인, 경남)" autocomplete="off">
      <div class="chips" id="regions"></div>
      <div class="chips" id="tags"></div>
      <div class="row">
        <span id="count"></span>
        <label>정렬
          <select id="sort">
            <option value="name">이름순</option>
            <option value="old">오래된 순</option>
            <option value="new">최근 순</option>
            <option value="diff">쉬운 순</option>
          </select>
        </label>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="legend">
      <span><i style="background:var(--h1)"></i>6세기 이전 창건</span>
      <span><i style="background:var(--h2)"></i>7세기</span>
      <span><i style="background:var(--h3)"></i>8~10세기</span>
      <span><i style="background:var(--h4)"></i>11세기 이후</span>
      <span><i style="background:var(--done)"></i>순례 완료</span>
    </div>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="lb-btn lb-close" data-lb="close" aria-label="닫기">×</button>
  <button class="lb-btn lb-prev" data-lb="prev" aria-label="이전 사진">‹</button>
  <img alt="">
  <div class="cap"></div>
  <button class="lb-btn lb-next" data-lb="next" aria-label="다음 사진">›</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="temples.js"></script>
<script src="images.js"></script>
<script>
// 파일 일부만 열었을 때(예: index.html 하나만 미리보기/업로드) 빈 화면 대신 원인을 알려 줌
window.addEventListener("DOMContentLoaded", function () {
  var miss = [];
  if (typeof TEMPLES === "undefined") miss.push("temples.js");
  if (typeof L === "undefined") miss.push("지도 라이브러리(Leaflet, 인터넷 필요)");
  if (miss.length) document.body.insertAdjacentHTML("afterbegin",
    '<div style="position:fixed;inset:0;z-index:9999;background:#fff;color:#222;padding:32px;font:16px/1.7 sans-serif">' +
    '<h2>화면을 불러오지 못했습니다</h2><p>다음 항목을 찾지 못했습니다: <b>' + miss.join(", ") + '</b></p>' +
    '<p>index.html, temples.js, images.js 를 <b>같은 폴더</b>에 두고 열어 주세요. (GitHub에는 세 파일을 모두 올려야 합니다.)</p></div>');
});
</script>
<script>
(() => {
  const REGIONS = ["전체", "수도권", "강원", "충청", "전라", "경상", "제주"];
  const TAGS = ["세계유산", "총림", "관음성지", "적멸보궁"];
  const DIFF = { 1: "쉬움", 2: "보통", 3: "어려움" };

  const temples = TEMPLES.map((t, i) => ({ ...t, id: i + 1 }));
  const state = { q: "", region: "전체", tag: "", sort: "name", selected: null, done: new Set() };

  // ---- 저장소: Supabase (모든 방문자가 같은 기록·사진을 공유) ----
  // 아래 URL과 키는 공개용(publishable) 키입니다. 쓰기 권한은 supabase/schema.sql 의 정책으로 제한됩니다.
  const SB_URL = "https://hriogfnsqbnvaiixjmko.supabase.co";
  const SB_KEY = "sb_publishable_NcK5NFya_FKF9nDMYOcl0g_kReBxuci";
  const BUCKET = "tp100-photos";
  const sbHeaders = (extra) => ({ apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, ...extra });
  async function sb(path, opts = {}) {
    const r = await fetch(`${SB_URL}${path}`, { ...opts, headers: sbHeaders(opts.headers) });
    if (!r.ok) throw new Error(`${r.status} ${await r.text().catch(() => "")}`);
    return r.status === 204 ? null : r.json().catch(() => null);
  }
  const photoUrl = (path) => `${SB_URL}/storage/v1/object/public/${BUCKET}/${path}`;
  const JSON_H = { "Content-Type": "application/json" };
  const UPSERT_H = { ...JSON_H, Prefer: "resolution=merge-duplicates,return=minimal" };

  const overrides = new Map(); // 사찰 id → Map(슬롯 → { path, thumb, mine })
  async function loadRemote() {
    const [done, photos] = await Promise.all([
      sb("/rest/v1/tp100_done?select=tp"),
      sb("/rest/v1/tp100_photos?select=tp,slot,path"),
    ]);
    state.done = new Set(done.map((r) => r.tp));
    for (const r of photos) {
      if (!overrides.has(r.tp)) overrides.set(r.tp, new Map());
      overrides.get(r.tp).set(r.slot, { path: r.path, thumb: photoUrl(r.path), mine: true });
    }
  }
  async function setDoneRemote(id, on) {
    if (on) await sb("/rest/v1/tp100_done?on_conflict=tp", { method: "POST", headers: UPSERT_H, body: JSON.stringify({ tp: id }) });
    else await sb(`/rest/v1/tp100_done?tp=eq.${id}`, { method: "DELETE" });
  }

  // 큰 사진은 긴 변 1600px JPEG로 줄여서 저장
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale);
      c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise((r) => c.toBlob((b) => r(b), "image/jpeg", 0.85));
    } catch { return null; } // 브라우저가 읽지 못하는 형식(예: 크롬의 HEIC)
  }
  const removeObject = (path) => sb(`/storage/v1/object/${BUCKET}/${path}`, { method: "DELETE" }).catch(() => {});
  // 슬롯(사진 순번)의 사진을 내 사진으로 교체. 읽을 수 없는 형식이면 false
  async function setPhoto(id, slot, file) {
    const blob = await shrink(file);
    if (!blob) return false;
    const path = `${id}/${slot}-${Date.now()}.jpg`;
    await sb(`/storage/v1/object/${BUCKET}/${path}`, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
    await sb("/rest/v1/tp100_photos?on_conflict=tp,slot", { method: "POST", headers: UPSERT_H, body: JSON.stringify({ tp: id, slot, path, updated_at: new Date().toISOString() }) });
    const old = overrides.get(id)?.get(slot);
    if (!overrides.has(id)) overrides.set(id, new Map());
    overrides.get(id).set(slot, { path, thumb: photoUrl(path), mine: true });
    if (old) removeObject(old.path);
    return true;
  }
  async function resetPhoto(id, slot) {
    const old = overrides.get(id)?.get(slot);
    await sb(`/rest/v1/tp100_photos?tp=eq.${id}&slot=eq.${slot}`, { method: "DELETE" });
    overrides.get(id)?.delete(slot);
    if (old) removeObject(old.path);
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const eraColor = (t) => css(t.ey == null ? "--h2" : t.ey < 600 ? "--h1" : t.ey < 700 ? "--h2" : t.ey < 1000 ? "--h3" : "--h4");
  const $toast = document.getElementById("toast");
  let toastTimer;
  const toast = (msg) => { $toast.textContent = msg; $toast.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => $toast.classList.remove("show"), 3500); };

  // ---- 지도 ----
  const map = L.map("map", { zoomControl: true }).setView([36.2, 127.8], 7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);

  const markers = new Map();
  for (const t of temples) {
    const mk = L.circleMarker([t.lat, t.lng], { ...markerStyle(t, false), className: "tp-marker" })
      .bindTooltip(`${esc(t.name)} · ${esc(t.year)}`, { className: "tp-label", direction: "top", offset: [0, -6] })
      .on("click", () => select(t.id, { fly: false }))
      .addTo(map);
    markers.set(t.id, mk);
  }
  function markerStyle(t, active) {
    const done = state.done.has(t.id);
    return {
      radius: active ? 11 : 7,
      color: "#ffffff",
      weight: active ? 3 : 2,
      fillColor: done ? css("--done") : eraColor(t),
      fillOpacity: 0.95,
    };
  }
  function refreshMarkers() {
    const visible = new Set(filtered().map((t) => t.id));
    for (const t of temples) {
      const mk = markers.get(t.id);
      const show = visible.has(t.id);
      if (show && !map.hasLayer(mk)) mk.addTo(map);
      if (!show && map.hasLayer(mk)) mk.remove();
      mk.setStyle(markerStyle(t, t.id === state.selected));
      if (t.id === state.selected) mk.bringToFront();
    }
  }

  // ---- 리스트 ----
  const $list = document.getElementById("list");
  const $count = document.getElementById("count");
  const $regions = document.getElementById("regions");
  const $tags = document.getElementById("tags");

  $regions.innerHTML = REGIONS.map((r) =>
    `<button class="chip" data-r="${r}" aria-pressed="${r === state.region}">${r}</button>`).join("");
  $regions.addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    state.region = b.dataset.r;
    $regions.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.r === state.region));
    render(true);
  });
  $tags.innerHTML = TAGS.map((t) => `<button class="chip" data-t="${t}" aria-pressed="false">${t}</button>`).join("");
  $tags.addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    state.tag = state.tag === b.dataset.t ? "" : b.dataset.t;
    $tags.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.t === state.tag));
    render(true);
  });
  let searchTimer;
  document.getElementById("q").addEventListener("input", (e) => {
    state.q = e.target.value.trim();
    render(false);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => render(true), 400); // 입력이 멈추면 지도 이동
  });
  document.getElementById("sort").addEventListener("change", (e) => { state.sort = e.target.value; render(false); });

  function filtered() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    return temples.filter((t) => {
      const hay = `${t.name} ${t.loc} ${t.prov} ${t.region} ${t.tags.join(" ")}`.toLowerCase();
      return (state.region === "전체" || t.region === state.region)
        && (!state.tag || t.tags.includes(state.tag))
        && terms.every((w) => hay.includes(w));
    });
  }
  function sorted(list) {
    const nul = (a, b) => (a.ey == null) - (b.ey == null);
    const by = {
      name: (a, b) => a.name.localeCompare(b.name, "ko"),
      old: (a, b) => nul(a, b) || a.ey - b.ey,
      new: (a, b) => nul(a, b) || b.ey - a.ey,
      diff: (a, b) => a.diff - b.diff || a.name.localeCompare(b.name, "ko"),
    }[state.sort];
    return [...list].sort(by);
  }

  function render(fit) {
    const list = sorted(filtered());
    $count.textContent = `${list.length}개 사찰`;
    $list.innerHTML = list.length ? list.map((t) => `
      <li><button class="item${t.id === state.selected ? " active" : ""}" data-id="${t.id}">
        <span class="no">${String(t.id).padStart(3, "0")}</span>
        <span><div class="nm">${esc(t.name)}</div><div class="lc">${esc(t.prov)} ${esc(t.loc)}</div></span>
        <span class="ht">${esc(t.year)}${state.done.has(t.id) ? `<small>✓ 완료</small>` : ""}</span>
      </button></li>`).join("")
      : `<li class="empty">검색 결과가 없습니다.</li>`;
    refreshMarkers();
    if (fit && list.length) {
      const b = L.latLngBounds(list.map((t) => [t.lat, t.lng]));
      map.flyToBounds(b.pad(0.15), { maxZoom: 10, duration: 0.6 });
    }
    updateProgress();
  }
  $list.addEventListener("click", (e) => {
    const b = e.target.closest(".item"); if (b) select(+b.dataset.id, { fly: true });
  });

  // ---- 상세 ----
  const $detail = document.getElementById("detail");
  function select(id, { fly }) {
    state.selected = id;
    const t = temples.find((x) => x.id === id);
    if (fly) map.flyTo([t.lat, t.lng], 11, { duration: 0.8 });
    renderDetail(t);
    render(false);
    const el = $list.querySelector(`.item[data-id="${id}"]`);
    if (el && !fly) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function renderDetail(t) {
    const done = state.done.has(t.id);
    const q = encodeURIComponent(`${t.name} ${t.prov} ${t.loc.split(" ")[0]}`);
    $detail.innerHTML = `
      <div class="d-head">
        <button class="close" aria-label="닫기">×</button>
        <div class="tag">No.${String(t.id).padStart(3, "0")} · ${esc(t.region)} · ${esc(t.prov)}</div>
        <h2>${esc(t.name)}</h2>
        <div class="loc">${esc(t.prov)} ${esc(t.loc)}</div>
        <div class="big">${esc(t.year)}<small> 창건</small></div>
      </div>
      <div class="d-body">
        ${galleryHtml(t)}
        ${t.tags.length ? `<div class="badges">${t.tags.map((x) => `<span class="badge">${esc(x)}</span>`).join("")}</div>` : ""}
        <p>${esc(t.desc)}</p>
        <div class="stats">
          <div class="stat"><div class="k">접근성</div><div class="v"><span class="dots">${"●".repeat(t.diff)}${"○".repeat(3 - t.diff)}</span> ${DIFF[t.diff]}</div></div>
          <div class="stat"><div class="k">관람시간</div><div class="v">${esc(t.time)}</div></div>
          <div class="stat"><div class="k">추천 계절</div><div class="v">${esc(t.season)}</div></div>
        </div>
        <div>
          <div class="section-t">대표 순례 코스</div>
          <div class="course">${esc(t.course)}</div>
        </div>
        <div class="actions">
          <button class="btn primary${done ? " is-done" : ""}" data-act="done">${done ? "✓ 순례 완료됨" : "순례 완료 표시"}</button>
          <a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${q}">네이버 지도</a>
          <a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/?q=${q}">카카오맵</a>
          <a class="btn" target="_blank" rel="noopener" href="https://search.naver.com/search.naver?where=image&query=${q}">사진 더 보기</a>
        </div>
        <div class="note">좌표는 대략적인 위치이며, 창건 연대는 사찰에 전해 오는 연기 설화를 따랐습니다. 코스와 시간은 참고용이니 개방 시간과 출입 제한은 사찰 공식 안내를 확인하세요. 템플스테이는 <a href="https://www.templestay.com" target="_blank" rel="noopener">templestay.com</a>에서 찾아볼 수 있습니다.</div>
      </div>`;
    $detail.classList.add("open");
  }

  // ---- 사진 (기본: Wikimedia Commons / 추가: 내가 올린 사진) ----
  const MAX_USER_PHOTOS = 5; // 기본 사진이 없는 사찰에 올릴 수 있는 내 사진 수
  const baseOf = (t) => (typeof TEMPLE_IMAGES !== "undefined" && TEMPLE_IMAGES[t.id]) || [];
  // 각 항목의 slot = 저장소에 기록되는 사진 순번.
  // 0 ~ (기본 사진 수-1)번 칸은 기본 사진 자리(내 사진으로 교체 가능), 그 뒤 칸은 내가 추가한 사진 (합계 최대 5장)
  const photosOf = (t) => {
    const base = baseOf(t), ov = overrides.get(t.id) || new Map();
    const ps = base.map((p, slot) => ({ ...p, slot }));
    for (const [slot, o] of ov) if (slot < ps.length) ps[slot] = { ...o, slot };
    const extra = [...ov.entries()].filter(([slot]) => slot >= base.length && slot < MAX_USER_PHOTOS).sort((a, b) => a[0] - b[0]);
    for (const [slot, o] of extra) ps.push({ ...o, slot });
    return ps;
  };
  const creditHtml = (p) => p.mine
    ? `내 사진`
    : `사진: ${esc(p.author || "작자 미상")}${p.license ? " · " + esc(p.license) : ""} · <a href="${esc(p.page)}" target="_blank" rel="noopener">Wikimedia Commons</a>`;
  const coverInner = (t, ps, idx) => {
    const canAdd = ps.length < MAX_USER_PHOTOS && baseOf(t).length < MAX_USER_PHOTOS;
    const parts = [canAdd
      ? `<label class="link-btn">📷 사진 추가 (${ps.length}/${MAX_USER_PHOTOS})<input type="file" accept="image/*" multiple hidden data-act="add"></label>`
      : `사진 ${ps.length}/${MAX_USER_PHOTOS}장 (가득 참)`];
    if (ps[idx]) parts.push(`<label class="link-btn">이 사진 교체<input type="file" accept="image/*" hidden data-act="cover"></label>`);
    if (ps[idx]?.mine) parts.push(`<button class="link-btn" data-act="delphoto">내 사진 삭제</button>`);
    return parts.join(" · ");
  };
  const coverCtl = (t, ps = photosOf(t), idx = 0) => `<div class="credit cover-ctl">${coverInner(t, ps, idx)}</div>`;
  let photoIdx = 0;

  function galleryHtml(t) {
    const ps = photosOf(t);
    photoIdx = 0;
    if (!ps.length) return `<div class="gallery"><div class="no-photo">등록된 사진이 없습니다.<br>‘사진 추가’로 내 사진을 최대 ${MAX_USER_PHOTOS}장까지 올리거나(한 번에 여러 장 가능) ‘사진 더 보기’로 확인하세요.</div>${coverCtl(t)}</div>`;
    return `<div class="gallery">
      <div class="g-main" data-act="zoom"><img src="${esc(ps[0].thumb)}" alt="${esc(t.name)} 사진 1"><span class="g-count">1 / ${ps.length}</span></div>
      ${ps.length > 1 ? `<div class="g-thumbs">${ps.map((p, i) =>
        `<button data-photo="${i}" aria-current="${i === 0}" aria-label="사진 ${i + 1}"><img loading="lazy" src="${esc(p.thumb)}" alt=""></button>`).join("")}</div>` : ""}
      <div class="credit">${creditHtml(ps[0])}</div>
      ${coverCtl(t)}
    </div>`;
  }
  function showPhoto(i) {
    const t = temples.find((x) => x.id === state.selected);
    const ps = photosOf(t);
    photoIdx = (i + ps.length) % ps.length;
    const p = ps[photoIdx];
    const main = $detail.querySelector(".g-main");
    main.querySelector("img").src = p.thumb;
    main.querySelector("img").alt = `${t.name} 사진 ${photoIdx + 1}`;
    main.querySelector(".g-count").textContent = `${photoIdx + 1} / ${ps.length}`;
    $detail.querySelectorAll(".g-thumbs button").forEach((b) => b.setAttribute("aria-current", +b.dataset.photo === photoIdx));
    $detail.querySelector(".credit").innerHTML = creditHtml(p);
    $detail.querySelector(".cover-ctl").innerHTML = coverInner(t, ps, photoIdx);
    if ($lb.classList.contains("open")) fillLightbox(t, p);
  }

  const $lb = document.getElementById("lightbox");
  function fillLightbox(t, p) {
    const img = $lb.querySelector("img");
    img.src = p.mine ? p.thumb : p.thumb.replace(/\/\d+px-/, "/1600px-");
    img.onerror = () => { img.onerror = null; img.src = p.thumb; };
    img.alt = `${t.name} 사진 ${photoIdx + 1}`;
    $lb.querySelector(".cap").innerHTML = `${esc(t.name)} (${photoIdx + 1}/${photosOf(t).length}) · ${creditHtml(p)}`;
  }
  let lbReturnFocus = null;
  function openLightbox() {
    const t = temples.find((x) => x.id === state.selected);
    lbReturnFocus = document.activeElement;
    $lb.classList.add("open");
    fillLightbox(t, photosOf(t)[photoIdx]);
    $lb.querySelector('[data-lb="close"]').focus();
  }
  function closeLightbox() {
    $lb.classList.remove("open");
    lbReturnFocus?.focus?.();
  }
  $lb.addEventListener("click", (e) => {
    const a = e.target.closest("[data-lb]")?.dataset.lb;
    if (a === "prev") showPhoto(photoIdx - 1);
    else if (a === "next") showPhoto(photoIdx + 1);
    else if (a === "close" || e.target === $lb) closeLightbox();
  });

  $detail.addEventListener("click", (e) => {
    const th = e.target.closest("[data-photo]");
    if (th) { showPhoto(+th.dataset.photo); return; }
    if (e.target.closest('[data-act="zoom"]')) { openLightbox(); return; }
    if (e.target.closest('[data-act="delphoto"]')) {
      const id = state.selected, ps = photosOf(temples.find((x) => x.id === id)), cur = ps[photoIdx];
      if (!cur || !confirm("이 사진을 삭제할까요?")) return;
      resetPhoto(id, cur.slot)
        .then(() => refreshGallery(id, Math.max(0, Math.min(photoIdx, photosOf(temples.find((x) => x.id === id)).length - 1))))
        .catch(() => toast("사진을 삭제하지 못했습니다. 네트워크를 확인하세요."));
      return;
    }
    if (e.target.closest(".close")) {
      $detail.classList.remove("open"); state.selected = null; render(false); return;
    }
    if (e.target.closest('[data-act="done"]')) {
      const id = state.selected;
      const on = !state.done.has(id);
      const apply = (v) => {
        if (v) state.done.add(id); else state.done.delete(id);
        if (state.selected === id) renderDetail(temples.find((x) => x.id === id));
        render(false);
      };
      apply(on); // 먼저 화면에 반영하고, 저장에 실패하면 되돌림
      setDoneRemote(id, on).catch(() => { apply(!on); toast("저장하지 못했습니다. 네트워크를 확인하세요."); });
    }
  });
  // 갤러리만 다시 그림
  function refreshGallery(id, idx = 0) {
    const t = temples.find((x) => x.id === id);
    $detail.querySelector(".gallery").outerHTML = galleryHtml(t);
    $lb.classList.remove("open");
    if (idx && photosOf(t).length > idx) showPhoto(idx);
  }
  const BAD_FORMAT = "이 브라우저에서 열 수 없는 형식입니다. (아이폰 HEIC 사진은 JPG로 변환해서 올려 주세요.)";
  $detail.addEventListener("change", async (e) => {
    if (e.target.dataset.act === "add" && e.target.files.length) {
      const id = state.selected, files = [...e.target.files];
      e.target.value = "";
      const used = new Set((overrides.get(id) || new Map()).keys());
      const baseN = baseOf(temples.find((x) => x.id === id)).length;
      const free = [...Array(MAX_USER_PHOTOS).keys()].filter((s) => s >= baseN && !used.has(s));
      if (!free.length) { toast(`사진은 최대 ${MAX_USER_PHOTOS}장까지 올릴 수 있어요.`); return; }
      if (files.length > free.length) toast(`사진은 최대 ${MAX_USER_PHOTOS}장까지예요. 앞의 ${free.length}장만 올립니다.`);
      const ctl = $detail.querySelector(".cover-ctl");
      if (ctl) ctl.textContent = "올리는 중…";
      let bad = 0, failed = false;
      for (const [i, file] of files.slice(0, free.length).entries()) {
        try { if (!(await setPhoto(id, free[i], file))) bad++; } catch { failed = true; break; }
      }
      if (state.selected === id) { const n = photosOf(temples.find((x) => x.id === id)).length; refreshGallery(id, Math.max(0, n - 1)); }
      if (failed) toast("사진을 저장하지 못했습니다. 네트워크를 확인하세요.");
      else if (bad) toast(BAD_FORMAT);
      return;
    }
    if (e.target.dataset.act !== "cover" || !e.target.files.length) return;
    const id = state.selected, slot = photosOf(temples.find((x) => x.id === id))[photoIdx]?.slot ?? photoIdx;
    const file = e.target.files[0];
    e.target.value = "";
    setPhoto(id, slot, file)
      .then((ok) => { if (ok) refreshGallery(id, slot); else toast(BAD_FORMAT); })
      .catch(() => toast("사진을 저장하지 못했습니다. 네트워크를 확인하세요."));
  });

  document.addEventListener("keydown", (e) => {
    if ($lb.classList.contains("open")) {
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showPhoto(photoIdx - 1);
      if (e.key === "ArrowRight") showPhoto(photoIdx + 1);
      return;
    }
    if (e.key === "Escape" && $detail.classList.contains("open")) $detail.querySelector(".close").click();
  });

  function updateProgress() {
    document.getElementById("doneCount").textContent = state.done.size;
    document.getElementById("doneBar").style.width = `${state.done.size}%`;
  }

  render(false);
  loadRemote()
    .then(() => { render(false); if (state.selected) renderDetail(temples.find((x) => x.id === state.selected)); })
    .catch(() => toast("저장된 기록을 불러오지 못했습니다. 네트워크를 확인하고 새로고침하세요."));
})();
</script>
</body>
</html>
